name: Regenerate website pages on update
on:
  push:
    branches: [focus-ml-research-itmostars]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: focus-ml-research-itmostars
      - name: Build and test
        run: |
          python3 scripts/build.py
          python3 scripts/check.py
      - name: Commit generated pages
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html ru/index.html sitemap.xml
          git diff --cached --quiet && exit 0
          git commit -m 'Regenerate pages after research-profile edits'
          git push origin HEAD:focus-ml-research-itmostars
