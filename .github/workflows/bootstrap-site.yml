name: Import initial website
on:
  push:
    branches: [website-v1]
    paths: ['_bootstrap/ready']
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: website-v1
      - name: Restore verified source and original PDF
        run: |
          python3 - <<'PY'
          import hashlib, io, lzma, pathlib, tarfile
          parts = sorted(pathlib.Path('_bootstrap').glob('part-*.bin'))
          assert len(parts) == 9, 'Incomplete website bundle'
          packed = b''.join(p.read_bytes() for p in parts)
          assert hashlib.sha256(packed).hexdigest() == '5c34599bb432941d77d90530f513b4b67a6042313798ba181be5f60429aa2a79', 'Bundle checksum mismatch'
          with tarfile.open(fileobj=io.BytesIO(lzma.decompress(packed)), mode='r:') as archive:
              archive.extractall('.', filter='data')
          cv = pathlib.Path('assets/vladimir-latypov-cv.pdf').read_bytes()
          assert hashlib.sha256(cv).hexdigest() == '5b262974b89a5f2b39d031314cd2c8242c3123e8cc52d3e03690e7673ffd3205'
          PY
          python3 scripts/build.py
          python3 scripts/check.py
      - name: Commit website to the review branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets ru scripts content.json index.html robots.txt sitemap.xml 404.html .gitignore .nojekyll README.md
          git commit -m 'Build first bilingual personal website with original CV'
          git push origin HEAD:website-v1
