name: Import initial website
on:
  push:
    branches: [website-v1]
    paths: ['_bootstrap/site.tar.xz.b64']
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: website-v1
      - name: Restore and verify the website bundle
        run: |
          python - <<'PY'
          import base64, hashlib, io, lzma, pathlib, tarfile
          source = pathlib.Path('_bootstrap/site.tar.xz.b64')
          packed = base64.b64decode(source.read_text(), validate=False)
          expected = pathlib.Path('_bootstrap/sha256.txt').read_text().strip()
          assert hashlib.sha256(packed).hexdigest() == expected, 'Bundle checksum mismatch'
          with tarfile.open(fileobj=io.BytesIO(lzma.decompress(packed)), mode='r:') as archive:
              archive.extractall('.', filter='data')
          cv = pathlib.Path('assets/vladimir-latypov-cv.pdf').read_bytes()
          assert hashlib.sha256(cv).hexdigest() == '5b262974b89a5f2b39d031314cd2c8242c3123e8cc52d3e03690e7673ffd3205'
          PY
          python scripts/build.py
          python scripts/check.py
      - name: Commit the complete source and original PDF to the review branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets ru scripts content.json template.html index.html robots.txt sitemap.xml 404.html .gitignore .nojekyll README.md
          git diff --cached --quiet && exit 0
          git commit -m 'Build first bilingual personal website with original CV'
          git push origin HEAD:website-v1
