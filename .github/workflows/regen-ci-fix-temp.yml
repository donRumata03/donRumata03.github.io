name: One-time HTML regeneration after manual edits
on:
  push:
    branches: [repair-ci-preserve-manual-edits-20261019]
    paths:
      - content.json
      - scripts/build.py
permissions:
  contents: write
jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: repair-ci-preserve-manual-edits-20261019
      - name: Regenerate pages and validate
        run: |
          python3 scripts/build.py
          python3 scripts/check.py
      - name: Commit generated HTML only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html ru/index.html sitemap.xml
          if ! git diff --cached --quiet; then
            git commit -m 'Sync generated pages with preserved site content'
            git push origin HEAD:repair-ci-preserve-manual-edits-20261019
          fi
