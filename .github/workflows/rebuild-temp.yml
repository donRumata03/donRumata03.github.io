name: Regenerate website pages
on:
  push:
    branches: [polish-russian-add-socials]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: polish-russian-add-socials
      - name: Build and test
        run: |
          python3 scripts/build.py
          python3 scripts/check.py
      - name: Commit generated bilingual HTML
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html ru/index.html sitemap.xml
          git diff --cached --quiet && exit 0
          git commit -m 'Regenerate site after localization and contact update'
          git push origin HEAD:polish-russian-add-socials
